# lineage_patch_template.yaml
# ──────────────────────────────────────────────────────────────────────────
# Template for submitting lineage changes via change_manager.py
#
# Usage:
#   Validate (no writes):  python change_manager.py apply-patch --file <this_file> --dry-run
#   Submit:                python change_manager.py apply-patch --file <this_file>
#   Via agent:             Tell the agent: "submit the patch at <path to this file>"
# ──────────────────────────────────────────────────────────────────────────

description: "Brief description of what is changing and why"
submitted_by: "your.email@domain.com"

changes:

  # ── UPDATE an edge expression ─────────────────────────────────────────
  - operation: UPDATE
    entity: cosmos_edge
    edge_id: "SCHEMA.TABLE.FIELD__to__SCHEMA.TABLE.FIELD__m_MAPPING_NAME"
    property: final_expression    # also: custom_sql | lookup_condition | filter_condition | update_strategy_expression
    new_value: "IIF(ISNULL(src.RATE), -1, src.RATE)"

  # ── ADD a new linkage between two fields ──────────────────────────────
  - operation: ADD
    entity: cosmos_edge
    from_id:      "SHAW_TPR.SOURCE_TABLE.SOURCE_FIELD"
    to_id:        "CRDM_DDM.TARGET_TABLE.TARGET_FIELD"
    mapping_name: "M_MAPPING_NAME"
    folder_name:  "FOLDER_NAME"     # optional
    expression:   "src.SOURCE_FIELD"  # optional

  # ── DELETE an existing linkage ────────────────────────────────────────
  - operation: DELETE
    entity: cosmos_edge
    edge_id: "SCHEMA.TABLE.FIELD__to__SCHEMA.TABLE.FIELD__m_MAPPING_NAME"

  # ── ADD a new field node ──────────────────────────────────────────────
  - operation: ADD
    entity: neo4j_field
    field_id:   "CRDM_DDM.F_TABLE.NEW_COLUMN"
    table_name: "F_TABLE"
    db_schema:  "CRDM_DDM"
    layer:      "DDM"           # TPR | TT | DDM
    data_type:  "VARCHAR2(50)"
    precision:  ""              # optional

  # ── UPDATE a field property ───────────────────────────────────────────
  - operation: UPDATE
    entity: neo4j_field
    field_id: "CRDM_DDM.F_TABLE.EXISTING_COLUMN"
    property: data_type         # also: precision | layer
    new_value: "NUMBER(18,6)"
