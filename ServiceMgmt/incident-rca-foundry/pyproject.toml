[project]
name = "incident-rca-foundry"
version = "0.1.0"
description = "Incident Root Cause Analysis using Microsoft Foundry and Azure Cosmos DB"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=html --cov-report=term"
